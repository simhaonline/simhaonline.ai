# Plesk vhost directives — simhaonline.ai (copy-paste ready)
#
# WHERE TO PASTE: Plesk → subscription simhaonline.ai → each domain →
# "Apache & nginx Settings" → "Additional nginx directives" → paste the
# block for that host → OK (Plesk reloads nginx itself).
#
# RULE: every web-facing vhost MUST have a `location / { … }` catch-all.
# Plesk merges these directives verbatim into the vhost server{} block;
# any path not matched by a location gets nginx's default 404.

# ── ALL HOSTS (paste this into every vhost first) ──────────────────────────
#location = /healthz {
#    proxy_pass http://127.0.0.1:8080;
#    proxy_set_header Host $host;
#    access_log off;
#}

# ── simhaonline.ai ─────────────────────────────────────────────────────────
location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 16m;
}

