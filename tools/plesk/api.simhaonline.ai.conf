# Paste into Plesk → domain api.simhaonline.ai → Apache & nginx Settings → Additional nginx directives
# (all targets point at the app server's real IP 152.53.67.111 — never 127.0.0.1)


location / {
    proxy_pass http://152.53.67.111:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 16m;
}
