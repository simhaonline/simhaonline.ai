# Paste into Plesk → domain simhaonline.ai → Apache & nginx Settings → Additional nginx directives
# (all targets point at the app server's real IP 152.53.67.111 — never 127.0.0.1)


location = /healthz {
    proxy_pass http://152.53.67.111:8080;
    proxy_set_header Host $host;
    access_log off;
}

location / {
    proxy_pass http://152.53.67.111:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 16m;
}
