name: simhaonline

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: simha-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simha_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-simhaonline}
    command: >
      postgres -c shared_preload_libraries=timescaledb,pg_stat_statements
      -c timescaledb.max_background_workers=8
      -c max_connections=300
      -c shared_buffers=512MB
      -c work_mem=32MB
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simha} -d ${POSTGRES_DB:-simhaonline}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: simha-valkey
    command: valkey-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: simha-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-simha-storage-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required — set a strong secret}
    volumes:
      - miniodata:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: simha-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set simha http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing simha/$${OBJECT_STORAGE_BUCKET} &&
      mc anonymous set none simha/$${OBJECT_STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-simha-storage-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required — set a strong secret}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-simha-user-files}
    restart: "no"

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: simha-gateway
    environment:
      GATEWAY_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-simha}:${POSTGRES_PASSWORD:-simha_dev_password}@postgres:5432/${POSTGRES_DB:-simhaonline}?sslmode=disable
      VALKEY_URL: valkey://valkey:6379/0
      CONTROL_PLANE_URL: http://control-plane:8081
      EDGE_BASE_DOMAINS: "simhaonline.ai"
      MODEL_POLICY_FILE: /config/model_policies.json
      PROVIDER_CATALOG_FILE: /config/provider_catalog.json
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-60}
      USAGE_THRESHOLD: ${USAGE_THRESHOLD:-0.9}
    volumes:
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "${PROXY_BIND_IP:-152.53.67.111}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    container_name: simha-control-plane
    environment:
      NODE_ENV: production
      PORT: 8081
      CORS_ORIGINS: ${CORS_ORIGINS:-https://simhaonline.ai,https://chat.simhaonline.ai,https://platform.simhaonline.ai,https://docs.simhaonline.ai,https://status.simhaonline.ai}
      DATABASE_URL: postgres://${POSTGRES_USER:-simha}:${POSTGRES_PASSWORD:-simha_dev_password}@postgres:5432/${POSTGRES_DB:-simhaonline}
      VALKEY_URL: valkey://valkey:6379/1
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required — copy .env.example}
      SESSION_TTL_HOURS: "24"
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.simhaonline.ai}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:?OAUTH_ENCRYPTION_KEY required — 32-byte hex}
      PROVIDER_CATALOG_FILE: /config/provider_catalog.json
      GATEWAY_URL: http://gateway:8080
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@simhaonline.ai}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@simhaonline.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-simha-user-files}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-simha-storage-admin}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required — set a strong secret}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${NEXT_PUBLIC_SITE_URL:-https://simhaonline.ai}/dashboard?billing=success
      STRIPE_CANCEL_URL: ${NEXT_PUBLIC_SITE_URL:-https://simhaonline.ai}/pricing?billing=cancelled
    volumes:
      - ./config:/config:ro
      - uploadsdata:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${PROXY_BIND_IP:-152.53.67.111}:8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: simha-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-simha}:${POSTGRES_PASSWORD:-simha_dev_password}@postgres:5432/${POSTGRES_DB:-simhaonline}
      VALKEY_URL: valkey://valkey:6379/2
      GATEWAY_URL: http://gateway:8080
      CONTROL_PLANE_URL: http://control-plane:8081
      MODEL_REFRESH_INTERVAL: ${MODEL_REFRESH_INTERVAL:-300}
      STATUS_SNAPSHOT_INTERVAL: ${STATUS_SNAPSHOT_INTERVAL:-60}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_DIR: /backups
      UPLOAD_DIR: /uploads
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-simha-user-files}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-simha-storage-admin}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required — set a strong secret}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
    volumes:
      - ./backups:/backups
      - uploadsdata:/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      gateway:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${PROXY_BIND_IP:-152.53.67.111}:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simha-web
    environment:
      NODE_ENV: production
      PORT: 3000
      CONTROL_PLANE_URL: http://control-plane:8081
      GATEWAY_URL: http://gateway:8080
      WORKER_URL: http://worker:8001
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://simhaonline.ai}
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "${PROXY_BIND_IP:-152.53.67.111}:3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# NOTE: no edge/nginx service — Plesk's nginx is the front door.
# Plesk proxy rules (Additional nginx directives on the simhaonline.ai subscription):
#   Remote Plesk proxies to THIS server's real IP (see tools/plesk-vhost-directives.conf):
#   location / { proxy_pass http://152.53.67.111:3002; ... }   # web vhosts (apex/platform/docs)
#   location ~ ^/(auth|admin|billing)(/|$) { proxy_pass http://152.53.67.111:8081; ... }   # chat vhost
#   location ~ ^/(status-data|status-subscribe)$ { proxy_pass http://152.53.67.111:8001; ... }  # status vhost
#   location / { proxy_pass http://152.53.67.111:8080; ... }   # api vhost
# ── Isolated engines (profile: "engines") ─────────────────────────────────────
# Standalone modules that must NOT touch core services: no DB, no valkey, no
# shared code. They live on the `engines` profile, so plain `docker compose up
# -d` never starts them and core deploys never rebuild them. Each binds
# 127.0.0.1 ONLY — reachable from the host / SSH tunnels, never from Plesk.
#
#   scraper     8111  Scrapling-inspired: fetch/extract/crawl/diff/monitor
#   reverse     8112  gitreverse-inspired: repo & website structure/dep analysis
#   router-opt  8113  OmniRoute-inspired: pool dedup, credit tiers, terms parsing
#   rank        8114  arena-rank-inspired: Elo leaderboard, battles, history
#
# Run/stop:  docker compose --profile engines up -d
#            docker compose --profile engines down
# Deploy:    tools/deploy-engines.sh (build + sha-tag + health-gate + prune)

  scraper:
    build: ./modules/scraper
    image: simhaonline-scraper:latest
    container_name: simha-scraper
    profiles: ["engines"]
    environment:
      SCRAPER_FETCH_TIMEOUT: "20"
    volumes:
      - enginesdata:/data
    ports:
      - "127.0.0.1:8111:8111"

  reverse:
    build: ./modules/reverse
    image: simhaonline-reverse:latest
    container_name: simha-reverse
    profiles: ["engines"]
    environment:
      REVERSE_FETCH_TIMEOUT: "20"
      REVERSE_CLONE_TIMEOUT: "120"
    volumes:
      - enginesdata:/data
    ports:
      - "127.0.0.1:8112:8112"

  router-opt:
    build: ./modules/router-opt
    image: simhaonline-router-opt:latest
    container_name: simha-router-opt
    profiles: ["engines"]
    ports:
      - "127.0.0.1:8113:8113"

  rank:
    build: ./modules/rank
    image: simhaonline-rank:latest
    container_name: simha-rank
    profiles: ["engines"]
    volumes:
      - enginesdata:/data
    ports:
      - "127.0.0.1:8114:8114"

  discovery:
    build: ./modules/discovery
    image: simhaonline-discovery:latest
    container_name: simha-discovery
    profiles: ["engines"]
    environment:
      DISCOVERY_DB_PATH: /data/discovery.db
      DISCOVERY_FETCH_TIMEOUT: "20"
    volumes:
      - enginesdata:/data
    ports:
      - "127.0.0.1:8115:8115"

  judge:
    build: ./modules/judge
    image: simhaonline-judge:latest
    container_name: simha-judge
    profiles: ["engines"]
    environment:
      JUDGE_DATABASE_URL: postgres://${POSTGRES_USER:-simha}:${POSTGRES_PASSWORD:-simha_dev_password}@postgres:5432/${POSTGRES_DB:-simhaonline}
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8116:8116"

volumes:
  pgdata:
  valkeydata:
  uploadsdata:
  miniodata:
  enginesdata:
