user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    proxy_http_version 1.1;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- hostname → vhost map (legacy contract preserved) ----
    map $host $simha_vhost {
        default                       web;
        ~^api\.                       api;
        ~^platform\.                  platform;
        ~^chat\.                      chat;
        ~^status\.                    status;
        ~^docs\.                      docs;
    }

    # X-Request-ID generation for every edge response
    split_clients "$request_id" $edge_request_id {
        100% $request_id;
    }

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'vhost=$simha_vhost rt=$request_time upstream_rt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    include /etc/nginx/conf.d/upstreams.conf;
    include /etc/nginx/conf.d/locations.conf;
}