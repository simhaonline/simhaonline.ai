# Hostname-separated routing, mirroring the legacy Plesk nginx contract.
# api.      → Go gateway  (/v1, /healthz, /status, /api/oauth/callback)
# platform. → control-plane (auth, admin APIs)
# chat.     → web (/chat UI) + gateway (/v1 same-origin) + control-plane (/chat/api)
# status.   → web (/status-data)
# docs.     → web (/docs)
# root host → public site (web)

server {
    listen 80 default_server;
    server_name _;

    add_header X-Request-ID $request_id always;
    add_header X-Simha-Edge "1" always;

    # ---- API host: client model API ----
    location ~ ^/v1(/|$) {
        proxy_pass http://simha_gateway;
        proxy_set_header Host api.simhaonline.ai;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
    }
    location = /healthz {
        proxy_pass http://simha_gateway;
        proxy_set_header Host api.simhaonline.ai;
        proxy_read_timeout 10s;
    }
    location = /status {
        proxy_pass http://simha_gateway;
        proxy_set_header Host api.simhaonline.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_buffering off;
        proxy_read_timeout 10s;
    }
    location ~ ^/api/oauth/callback/ {
        proxy_pass http://simha_control_plane;
        proxy_set_header Host api.simhaonline.ai;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # ---- Platform + Chat: control-plane APIs ----
    location ~ ^/(auth|admin)/ {
        proxy_pass http://simha_control_plane;
        proxy_set_header Host platform.simhaonline.ai;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location ~ ^/chat/api/ {
        proxy_pass http://simha_control_plane;
        proxy_set_header Host chat.simhaonline.ai;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---- Status host ----
    location = /status-data {
        proxy_pass http://simha_web;
        proxy_set_header Host status.simhaonline.ai;
        proxy_read_timeout 15s;
    }

    # ---- Web: public site, /login, /signup, /chat UI, /dashboard, /docs ----
    location / {
        proxy_pass http://simha_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}